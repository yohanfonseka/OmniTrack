steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA'
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA'

  # Pinned to exactly 1 instance: app state lives in the server's memory
  # (hydrated from Firestore on boot), so running more than one instance
  # would let replicas diverge and clobber each other's Firestore writes.
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--min-instances=1'
      - '--max-instances=1'
      - '--allow-unauthenticated'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA'

substitutions:
  # asia-southeast1 keeps the app close to its users and to the existing
  # AI Studio deployment. The service name must stay distinct from that
  # AI-Studio-managed 'omnitrack' service so deploys never overwrite it.
  _REGION: asia-southeast1
  _REPOSITORY: omnitrack
  _SERVICE: omnitrack-app

options:
  logging: CLOUD_LOGGING_ONLY
